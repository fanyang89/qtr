[package]
name = "qtr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
similar = "2"
toml = "0.8"
uuid = { version = "1.10", features = ["v4"] }
virt = { version = "0.4.3", features = ["qemu"] }

[build-dependencies]
pkg-config = "0.3"
