# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NFPM: nfpm
  INVENTORY: deploy/inventory.ini
  LIMIT: qtr
  ANSIBLE_PLAYBOOK: deploy/playbooks/install-rpm.yml
  QTR_VERSION:
    sh: cargo pkgid | cut -d# -f2

tasks:
  build:
    desc: Build the qtr release binary
    cmds:
      - cargo build --release

  package:rpm:
    desc: Build the qtr RPM package
    deps:
      - build
    cmds:
      - mkdir -p dist
      - QTR_VERSION="{{.QTR_VERSION}}" {{.NFPM}} pkg --packager rpm --target dist/

  package:
    desc: Build all release packages
    deps:
      - package:rpm

  ansible:sync:
    desc: Sync the uv-managed Ansible environment
    cmds:
      - uv sync --locked

  ansible:ping:
    desc: Ping qtr deploy targets
    cmds:
      - uv run ansible "{{.LIMIT}}" -i "{{.INVENTORY}}" -m ping

  deploy:rpm:
    desc: Build and install the qtr RPM on Fedora 44 targets
    cmds:
      - task: package:rpm
      - task: ansible:sync
      - uv run ansible-playbook -i "{{.INVENTORY}}" --limit "{{.LIMIT}}" "{{.ANSIBLE_PLAYBOOK}}" -e "qtr_rpm_path=dist/qtr-{{.QTR_VERSION}}-1.x86_64.rpm"

  clean:dist:
    desc: Remove release package artifacts
    cmds:
      - rm -rf dist
