---
- name: Install qtr RPM on Fedora 44
  hosts: qtr
  gather_facts: true
  become: true

  vars:
    qtr_local_rpm_path: "{{ [playbook_dir, '..', '..', qtr_rpm_path] | ansible.builtin.path_join }}"
    qtr_remote_rpm_path: "/tmp/{{ qtr_local_rpm_path | basename }}"

  pre_tasks:
    - name: Require qtr_rpm_path
      ansible.builtin.assert:
        that:
          - qtr_rpm_path is defined
          - qtr_rpm_path | length > 0
        fail_msg: "Pass the local RPM path with -e qtr_rpm_path=dist/qtr-...rpm"

    - name: Check local RPM exists
      ansible.builtin.stat:
        path: "{{ qtr_local_rpm_path }}"
      delegate_to: localhost
      become: false
      register: qtr_local_rpm

    - name: Require local RPM file
      ansible.builtin.assert:
        that:
          - qtr_local_rpm.stat.exists
          - qtr_local_rpm.stat.isreg
        fail_msg: "Local RPM not found: {{ qtr_local_rpm_path }}"

    - name: Require Fedora 44 target
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ansible_facts.distribution_major_version == "44"
        fail_msg: "This deploy playbook supports Fedora 44 targets only."

  tasks:
    - name: Copy qtr RPM to target
      ansible.builtin.copy:
        src: "{{ qtr_local_rpm_path }}"
        dest: "{{ qtr_remote_rpm_path }}"
        mode: "0644"

    - name: Check qtr package
      ansible.builtin.command: rpm -q qtr
      changed_when: false
      failed_when: false
      register: qtr_installed

    - name: Install qtr RPM
      ansible.builtin.command:
        argv:
          - dnf5
          - --setopt=localpkg_gpgcheck=False
          - install
          - -y
          - "{{ qtr_remote_rpm_path }}"
      changed_when: true
      when: qtr_installed.rc != 0

    - name: Reinstall qtr RPM
      ansible.builtin.command:
        argv:
          - dnf5
          - --setopt=localpkg_gpgcheck=False
          - reinstall
          - -y
          - "{{ qtr_remote_rpm_path }}"
      changed_when: true
      when: qtr_installed.rc == 0

    - name: Enable and start libvirtd
      ansible.builtin.systemd_service:
        name: libvirtd
        enabled: true
        state: started

    - name: Verify qtr installation
      ansible.builtin.command: qtr --version
      changed_when: false
      register: qtr_version

    - name: Print qtr version
      ansible.builtin.debug:
        msg: "{{ qtr_version.stdout }}"
