schemaVersion: 2
name: install-os
machine:
  type: q35
cpu:
  mode: host-passthrough
  topology:
    sockets: 1
    cores: 2
    threads: 1
memory:
  sizeMiB: 4096
disks:
- id: root
  path: /var/lib/libvirt/images/install-os.qcow2
  type: file
  format: qcow2
cdrom: /path/to/installer.iso
boot:
- cdrom
- hd
network: default
graphics: vnc
vncListen: 127.0.0.1
