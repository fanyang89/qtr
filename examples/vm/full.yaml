schemaVersion: 4
name: install-os
machine:
  type: q35
cpu:
  mode: host-model
  topology:
    sockets: 1
    cores: 4
    threads: 1
memory:
  sizeMiB: 6144
  maxMiB: 8192
ioThreads:
  count: 4
  queues: 4
disks:
- id: root
  path: .tmp/disks/install-os.qcow2
  type: file
  format: qcow2
  target: vda
  bus: virtio-blk
  discard: unmap
  detectZeroes: unmap
  serial: root-disk
  ioTune:
    readBytesPerSec: 75000000
    writeBytesPerSec: 25000000
    totalIops: 1000
- id: data
  path: /dev/disk/by-id/example-block-device
  type: block
  format: raw
  target: sda
  bus: virtio-scsi
  cache: none
  readonly: true
  io:
    mode: threads
cdroms:
- id: installer
  media: /path/to/installer.iso
- id: tools
  media: null
boot:
- cdrom
- hd
interfaces:
- id: primary
  type: network
  source: default
  model: virtio
- id: storage
  type: bridge
  source: br-storage
  model: virtio
  vlan: 100
  mtu: 9000
  link: up
- id: uplink
  type: direct
  source: eno1
  model: virtio
  mode: bridge
graphics: vnc
vncListen: 127.0.0.1
serialLog: .tmp/logs/install-os.serial.log
