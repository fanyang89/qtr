schemaVersion: 1
name: install-os
machine:
  type: q35
cpu:
  mode: host-model
  topology:
    sockets: 1
    cores: 4
    threads: 1
memory:
  sizeMiB: 6144
  maxMiB: 8192
ioThreads:
  count: 4
  queues: 4
disks:
- id: root
  path: .tmp/disks/install-os.qcow2
  type: file
  format: qcow2
  target: vda
  bus: virtio-blk
- id: data
  path: /dev/disk/by-id/example-block-device
  type: block
  format: raw
  target: sda
  bus: virtio-scsi
  cache: none
  io:
    mode: threads
cdrom: /path/to/installer.iso
boot:
- cdrom
- hd
network: default
graphics: vnc
vncListen: 127.0.0.1
serialLog: .tmp/logs/install-os.serial.log
