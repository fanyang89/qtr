name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          web_version=$(node -p "require('./web/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$web_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build qtr
        run: cargo build --locked --release

      - name: Build Web UI
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      - name: Package release archive
        env:
          QTR_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-release.sh

      - name: Attest release archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/qtr-v${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/qtr-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/qtr-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
