name: qtr
arch: amd64
platform: linux
version: ${QTR_VERSION}
version_schema: semver
release: 1
maintainer: fanyang
description: QEMU/libvirt VM manager
license: MIT
vendor: qtr

contents:
  - src: ./target/release/qtr
    dst: /usr/bin/qtr
    file_info:
      mode: 0755
  - src: ./web/dist/
    dst: /usr/share/qtr/web
    type: tree
  - src: ./packaging/qtr.service
    dst: /usr/lib/systemd/system/qtr.service
    file_info:
      mode: 0644
  - src: ./packaging/qtr.sysusers.conf
    dst: /usr/lib/sysusers.d/qtr.conf
    file_info:
      mode: 0644
  - src: ./packaging/qtr.tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/qtr.conf
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  postremove: ./packaging/postremove.sh

depends:
  - acl
  - edk2-ovmf
  - iscsi-initiator-utils
  - libvirt-client
  - libvirt-daemon
  - libvirt-daemon-config-network
  - libvirt-daemon-driver-qemu
  - libvirt-daemon-kvm
  - libvirt-libs
  - libosinfo
  - osinfo-db
  - openssh-clients
  - polkit
  - pykickstart
  - qemu-img
  - qemu-kvm
  - shadow-utils
  - systemd
  - util-linux-core
  - virt-install

rpm:
  group: Applications/System
