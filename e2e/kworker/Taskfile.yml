# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NULLB_NAME: nullb0
  NULLB_SIZE_MIB: 102400
  VM_NAME: c7-957
  DATA_DEVICE: /dev/vdb
  VG_NAME: qtr_kworker
  LV_NAME: data
  MOUNT_POINT: /mnt/data
  MOUNT_OPTIONS: defaults,nobarrier
  VM_EXEC_TIMEOUT_SECS: 900

tasks:
  setup:
    desc: Set up kworker e2e resources
    cmds:
      - task: setup-nullb

  teardown:
    desc: Tear down kworker e2e resources
    cmds:
      - task: teardown-nullb

  prepare-vm-filesystem:
    desc: Prepare the kworker e2e guest filesystem
    cmds:
      - qtr vm exec {{.VM_NAME}} -- sh -c 'if mountpoint -q {{.MOUNT_POINT}}; then sudo umount {{.MOUNT_POINT}}; fi'
      - qtr vm exec {{.VM_NAME}} -- sh -c 'if sudo vgs --noheadings {{.VG_NAME}} >/dev/null 2>&1; then sudo vgremove -ff -y {{.VG_NAME}}; fi'
      - qtr vm exec {{.VM_NAME}} -- sudo wipefs -a {{.DATA_DEVICE}}
      - qtr vm exec {{.VM_NAME}} -- sudo pvcreate -ff -y {{.DATA_DEVICE}}
      - qtr vm exec {{.VM_NAME}} -- sudo vgcreate {{.VG_NAME}} {{.DATA_DEVICE}}
      - qtr vm exec {{.VM_NAME}} -- sudo lvcreate -y -n {{.LV_NAME}} -l 100%FREE {{.VG_NAME}}
      - qtr vm exec {{.VM_NAME}} -- sudo mkfs.xfs -f /dev/{{.VG_NAME}}/{{.LV_NAME}}
      - qtr vm exec {{.VM_NAME}} -- sudo mkdir -p {{.MOUNT_POINT}}
      - qtr vm exec {{.VM_NAME}} -- sudo mount -o {{.MOUNT_OPTIONS}} /dev/{{.VG_NAME}}/{{.LV_NAME}} {{.MOUNT_POINT}}

  run-vm-fio:
    desc: Run the kworker e2e fio workload
    cmds:
      - qtr vm exec {{.VM_NAME}} --timeout-secs {{.VM_EXEC_TIMEOUT_SECS}} --script "{{.TASKFILE_DIR}}/run-fio.sh"

  setup-nullb:
    internal: true
    cmds:
      - sudo modprobe null_blk nr_devices=0
      - if ! mountpoint -q /sys/kernel/config; then sudo mount -t configfs configfs /sys/kernel/config; fi
      - |
        set -eu
        config_dir="/sys/kernel/config/nullb/{{.NULLB_NAME}}"
        if [ -b "/dev/{{.NULLB_NAME}}" ]; then
          exit 0
        fi
        if [ ! -d "$config_dir" ]; then
          sudo mkdir "$config_dir"
        fi
        printf '2\n' | sudo tee "$config_dir/queue_mode" >/dev/null
        printf '1\n' | sudo tee "$config_dir/memory_backed" >/dev/null
        printf '{{.NULLB_SIZE_MIB}}\n' | sudo tee "$config_dir/size" >/dev/null
        printf '1\n' | sudo tee "$config_dir/power" >/dev/null
        test -b "/dev/{{.NULLB_NAME}}"

  teardown-nullb:
    internal: true
    status:
      - 'test ! -d /sys/kernel/config/nullb/{{.NULLB_NAME}}'
    cmds:
      - |
        set -eu
        config_dir="/sys/kernel/config/nullb/{{.NULLB_NAME}}"
        if [ -d "$config_dir" ]; then
          if [ -e "$config_dir/power" ]; then
            printf '0\n' | sudo tee "$config_dir/power" >/dev/null || true
          fi
          sudo rmdir "$config_dir"
        fi
