---
name: c7
vcpus: 4
memoryGiB: 8
disks:
  - bus: virtio-blk
    format: qcow2
    path: ../../.tmp/disks/sys.qcow2
    target: vda
    type: file
  - bus: virtio-blk
    cache: none
    format: raw
    io:
      mode: native
    path: /dev/nullb0
    target: vdb
    type: block
boot:
  - hd
graphics: vnc
vncListen: 0.0.0.0
network: default
serialLog: ../../.tmp/logs/install-os.serial.log
