---
name: c7-957
vcpus: 4
memoryGiB: 8
cdrom: ../../.tmp/iso/CentOS-7-x86_64-DVD-1810.iso
disks:
  - bus: virtio-blk
    format: qcow2
    path: ../../.tmp/disks/sys-957.qcow2
    target: vda
    type: file
  - bus: virtio-blk
    cache: none
    format: raw
    io:
      mode: native
    path: /dev/nullb0
    target: vdb
    type: block
boot:
  - hd
  - cdrom
graphics: vnc
vncListen: 0.0.0.0
network: default
serialLog: ../../.tmp/logs/sys-957.serial.log
